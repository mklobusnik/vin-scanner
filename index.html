<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Force browser to bypass GitHub CDN caching -->
    <meta http-equiv="cache-control" content="no-cache">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">
    <title>VIN Barcode Generator</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Only one ultra-reliable library used for drawing the bars -->
    <script src="https://jsdelivr.net"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f8fafc;
            color: #0f172a;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 20px auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { font-size: 20px; margin-bottom: 5px; color: #1e293b; }
        p { font-size: 13px; color: #64748b; margin-bottom: 20px; }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            box-sizing: border-box;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: monospace;
        }
        input:focus {
            border-color: #2563eb;
            outline: none;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 4px rgba(37,99,235,0.2);
        }
        .btn:active { background-color: #1d4ed8; }
        
        .result-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
            display: none;
        }
        #vin-display {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #0f172a;
            margin-bottom: 15px;
        }
        #barcode-wrapper {
            background: white;
            padding: 15px 5px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
        #barcode {
            width: 100%;
            height: auto;
            max-height: 130px;
        }
        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VIN to Barcode</h1>
    <p>For Midtronics Battery Testers</p>
    
    <div class="input-group">
        <label for="vin-input">Enter or Scan 17-Digit VIN:</label>
        <!-- Autofocus triggers mobile keyboards immediately. 
             If using iPhone, tap the text box and choose "Scan Text" to use Apple's native OCR camera! -->
        <input type="text" id="vin-input" placeholder="ENTER 17 CHARACTERS" maxlength="17" autocomplete="off" autocapitalize="characters">
        <div class="error-msg" id="error-text">VIN must be exactly 17 characters.</div>
    </div>
    
    <button class="btn" id="generate-btn">Generate Barcode</button>
    
    <div class="result-box" id="result-section">
        <div id="vin-display">---</div>
        <div id="barcode-wrapper">
            <svg id="barcode"></svg>
        </div>
    </div>
</div>

<script>
    const vinInput = document.getElementById('vin-input');
    const generateBtn = document.getElementById('generate-btn');
    const resultSection = document.getElementById('result-section');
    const vinDisplay = document.getElementById('vin-display');
    const errorText = document.getElementById('error-text');

    // Automatically clean text as user types or pastes
    vinInput.addEventListener('input', (e) => {
        // Force uppercase and strip illegal characters (Spaces, symbols, and standard forbidden letters I, O, Q)
        let cleaned = e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '');
        e.target.value = cleaned;
    });

    generateBtn.addEventListener('click', () => {
        const val = vinInput.value.trim();
        
        if (val.length !== 17) {
            errorText.style.display = 'block';
            resultSection.style.display = 'none';
            return;
        }
        
        errorText.style.display = 'none';
        vinDisplay.innerText = val;
        resultSection.style.display = 'block';
        
        // Generate high-density Code 128 format optimized for Midtronics laser lenses
        JsBarcode("#barcode", val, {
            format: "CODE128",
            width: 2.8, 
            height: 95,
            displayValue: true,
            fontSize: 16,
            background: "#ffffff",
            lineColor: "#000000",
            margin: 10
        });
    });
</script>

</body>
</html>
